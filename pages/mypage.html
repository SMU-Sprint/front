<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint | 마이페이지</title>
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/mypage.css" />
    <script src="../js/app.js" defer></script>
  </head>
  <body data-page="mypage">
    <div id="sidebar-container"></div>
    <main class="app-shell mypage">
      <section class="profile-card">
        <!-- 💡 아바타를 클릭해 사진을 업로드할 수 있도록 label과 file input 추가 -->
        <label
          for="profileImageInput"
          class="avatar"
          aria-label="프로필 이미지 선택"
        >
          <input
            type="file"
            id="profileImageInput"
            accept="image/*"
            style="display: none"
          />
          <span class="avatar-placeholder-text">사진 변경</span>
        </label>

        <div class="profile-grid">
          <div class="info-row">
            <span>나이</span>
            <div class="value-with-unit">
              <strong id="profileAge">00</strong>
              <span>세</span>
            </div>
          </div>

          <div class="info-row">
            <span>성별</span>
            <div class="value-with-unit">
              <strong id="profileGender">성별</strong>
            </div>
          </div>

          <div class="info-row">
            <span>키</span>
            <div class="value-with-unit">
              <strong id="profileHeight">000</strong>
              <span>cm</span>
            </div>
          </div>

          <div class="info-row">
            <span>몸무게</span>
            <div class="value-with-unit">
              <strong id="profileWeight">00</strong>
              <span>kg</span>
            </div>
          </div>
        </div>
      </section>

      <!-- mypage.html 내부 preferences 섹션 수정 -->
      <section class="preferences">
        <div><span>운동지역</span><strong id="userRegion">00</strong></div>
        <div>
          <span>선호하는 운동 요일</span
          ><strong id="userDay">00, 00, 00, 00</strong>
        </div>
        <div>
          <span>선호하는 운동 시간대</span
          ><strong id="userTime">00시,00시,00시</strong>
        </div>
      </section>
      <div class="actions">
        <a class="btn primary" href="mypage_correction2.html"
          >회원정보 수정하기</a
        >
        <a class="btn survey" href="survey1.html">설문하러가기</a>
        <div class="danger-row">
          <button class="btn danger" data-modal-open="logout-modal">
            로그아웃
          </button>
          <button class="btn danger" data-modal-open="withdraw-modal">
            탈퇴
          </button>
        </div>
      </div>
    </main>

    <dialog class="confirm-modal" id="logout-modal">
      <div class="modal-box">
        <p>정말 로그아웃하시겠습니까?</p>
        <div>
          <button class="outline">예</button
          ><button class="filled" data-modal-close>아니요</button>
        </div>
      </div>
    </dialog>
    <dialog class="confirm-modal" id="withdraw-modal">
      <div class="modal-box">
        <p>정말 탈퇴하시겠습니까?</p>
        <div>
          <button class="outline">예</button
          ><button class="filled" data-modal-close>아니요</button>
        </div>
      </div>
    </dialog>
    <script src="../js/mypage.js" defer></script>
  </body>
</html>
