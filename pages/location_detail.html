<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장소 - 상세 정보</title>
    <link rel="stylesheet" href="../css/location_detail.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <script src="../js/app.js" defer></script>
    <link rel="stylesheet" href="../css/workout.css" />
    <script src="../js/workout-config.js" defer></script>
    <script src="../js/workout-service.js" defer></script>
    <script src="../js/workout-ui.js" defer></script>
    <script
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5dd186629d1ef37a8c1e69161acc639c&autoload=false&libraries=clusterer"
      defer
    ></script>
    <script src="../js/workout-map.js" defer></script>
    <script src="../js/location-workout.js" defer></script>
  </head>

  <body data-page="place" data-workout-page="detail">
    <div class="page-wrapper">
      <div id="sidebar-container"></div>

      <!-- 오른쪽 메인 장소/지도 영역 -->
      <section
        class="main-section"
>
        <!-- 지도 영역 -->
        <div class="map-and-locations">
          <div id="workout-map" class="map-container" aria-label="운동 장소 지도"></div>
          <div id="location-list" class="location-list" aria-label="운동 장소 목록"></div>
          <p class="demo-note" data-demo-note hidden>체험 모드 · 장소·종목은 예시이며, 기록은 이 브라우저에만 저장됩니다.</p>
          <p id="workout-message" class="workout-message" role="status"></p>
        </div>

        <!-- 4개 구역으로 균등 분배된 우측 패널 -->
        <aside class="info-panel">
          <div class="info-section">
            <div class="date-main" data-current-date></div>
            <div class="day-sub" data-current-weekday></div>
          </div>
          <div class="info-section sport-section">
            <small id="location-name">장소를 선택하세요</small>
            <p id="location-meta" class="location-meta"></p>
            <div class="sport-picker">
              <button type="button" id="sport-trigger" class="sport-name" aria-haspopup="listbox" aria-expanded="false" aria-controls="sport-options" disabled>운동 선택 ▾</button>
              <div id="sport-options" class="sport-options" role="listbox" aria-label="가능한 운동" hidden></div>
            </div>
          </div>
          <div class="info-section">
            <button type="button" id="startBtn" class="action-btn start-btn" disabled>시작하기</button>
          </div>
          <div class="info-section">
            <button type="button" id="endBtn" class="action-btn end-btn" disabled>종료하기</button>
            <a href="main.html" class="view-session">메인에서 시간 확인</a>
          </div>
        </aside>
      </section>
    </div>


  </body>
</html>
