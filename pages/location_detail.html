<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장소 - 상세 정보</title>
    <link rel="stylesheet" href="../css/location_detail.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!-- 사이드바 영역 -->
      <aside class="sidebar-section">
        <nav class="nav-links">
          <a href="main.html" class="nav-item">
            <img src="../images/main_off.png" alt="메인" class="nav-img" />
          </a>
          <a href="location.html" class="nav-item">
            <img src="../images/location_on.png" alt="장소" class="nav-img" />
          </a>
          <a href="mypage.html" class="nav-item">
            <img src="../images/mypage_off.png" alt="마이" class="nav-img" />
          </a>
        </nav>
      </aside>

      <!-- 오른쪽 메인 장소/지도 영역 -->
      <section
        class="main-section"
        style="background-image: url(&quot;../images/location.png&quot;)"
      >
        <!-- 지도 영역 -->
        <div class="map-container">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d101235.39433917822!2d126.89136195729724!3d37.53488210359146!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca2012d5c39cf%3A0x7e11eca1405bf29b!2z7ISc7Jq47Yq567OE7Iuc!5e0!3m2!1sko!2skr!4v1700000000000!5m2!1sko!2skr"
            width="100%"
            height="100%"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
          >
          </iframe>
        </div>

        <!-- 4개 구역으로 균등 분배된 우측 패널 -->
        <div class="info-panel">
          <!-- 1구역: 날짜 및 요일 -->
          <div class="info-section">
            <span id="dateText" class="date-main">2026/09/14</span>
            <span id="dayText" class="day-sub">월요일</span>
          </div>

          <div class="divider"></div>

          <!-- 2구역: 운동 종목 -->
          <div class="info-section">
            <span id="sportText" class="sport-name">테니스</span>
          </div>

          <div class="divider"></div>

          <!-- 3구역: 시작하기 버튼 -->
          <div class="info-section">
            <button type="button" id="startBtn" class="action-btn start-btn">
              시작하기
            </button>
          </div>

          <div class="divider"></div>

          <!-- 4구역: 종료하기 버튼 -->
          <div class="info-section">
            <button type="button" id="endBtn" class="action-btn end-btn">
              종료하기
            </button>
          </div>
        </div>
      </section>
    </div>

    <!-- 데이터 연동 스크립트 -->
    <script>
      function updateDateTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");

        const days = [
          "일요일",
          "월요일",
          "화요일",
          "수요일",
          "목요일",
          "금요일",
          "토요일",
        ];
        const dayOfWeek = days[now.getDay()];

        document.getElementById("dateText").textContent =
          `${year}/${month}/${day}`;
        document.getElementById("dayText").textContent = dayOfWeek;
      }

      window.addEventListener("DOMContentLoaded", () => {
        updateDateTime();
      });

      document.getElementById("startBtn").addEventListener("click", () => {
        alert("운동을 시작합니다!");
      });

      document.getElementById("endBtn").addEventListener("click", () => {
        alert("운동을 종료합니다.");
      });
    </script>
  </body>
</html>
