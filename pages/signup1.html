<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="../css/signup1.css" />
    <link rel="stylesheet" href="../css/verification.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- 로고 -->
      <img src="../images/logo.png" alt="Sprint 로고" class="logo" />

      <!-- 입력 영역 -->
      <div class="login-form">
        <!-- 이메일 입력 그룹 -->
        <div class="input-row">
          <input
            type="email"
            id="emailInput"
            class="login-input"
            placeholder="이메일"
          />
          <button type="button" id="authRequestBtn" class="side-button">
            인증번호 받기
          </button>
        </div>

        <!-- 인증번호 입력 그룹 -->
        <div class="input-row">
          <input
            type="text"
            id="codeInput"
            class="login-input"
            placeholder="인증번호"
          />
          <button type="button" id="authConfirmBtn" class="side-button">
            인증번호 확인
          </button>
        </div>
        <span id="errorMsg" class="error-message"
          >인증번호가 일치하지 않습니다.</span
        >

        <!-- 다음 버튼 -->
        <a href="signup2.html" id="nextButton" class="next-button">
          <img id="nextImage" src="../images/next_off.png" alt="다음" />
        </a>
      </div>

      <!-- 구분선 -->
      <div class="divider"></div>

      <!-- 소셜 로그인 -->
      <div class="social-login">
        <button class="social-button">
          <img src="../images/kakao-login.png" alt="카카오 로그인" />
        </button>

        <button class="social-button">
          <img src="../images/naver-login.png" alt="네이버 로그인" />
        </button>
      </div>

      <!-- 구분선 -->
      <div class="divider bottom-divider"></div>

      <!-- 하단 링크 -->
      <div class="bottom-links">
        <a href="login.html" class="signup-link"> 로그인 바로가기 </a>
        <a href="find_password.html" class="password-link"> 비밀번호 찾기 </a>
      </div>
    </main>

    <!-- 인터랙션 및 버튼 활성화 스크립트 -->
    <script src="../js/verification.js" defer></script>
  
  </body>
</html>
