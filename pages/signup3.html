<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint 사용자 등록하기</title>
    <link rel="stylesheet" href="../css/signup3.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- 상단 타이틀 -->
      <h1 class="title">사용자 등록하기</h1>

      <!-- 입력 영역 -->
      <div class="login-form">
        <!-- 성별 선택 탭 -->
        <div class="gender-container">
          <button type="button" id="maleBtn" class="gender-btn active">
            남성
          </button>
          <button type="button" id="femaleBtn" class="gender-btn">여성</button>
        </div>

        <!-- 나이 -->
        <input
          type="number"
          id="ageInput"
          class="login-input"
          placeholder="나이"
        />

        <!-- 키 -->
        <div class="input-suffix-wrap">
          <input
            type="number"
            id="heightInput"
            class="login-input"
            placeholder="키"
          />
          <span class="suffix">cm</span>
        </div>

        <!-- 몸무게 -->
        <div class="input-suffix-wrap">
          <input
            type="number"
            id="weightInput"
            class="login-input"
            placeholder="몸무게"
          />
          <span class="suffix">kg</span>
        </div>

        <!-- 운동 지역 선택 -->
        <input
          type="text"
          id="regionInput"
          class="login-input"
          placeholder="운동 지역 선택"
        />

        <!-- 선호하는 운동 요일 -->
        <input
          type="text"
          id="dayInput"
          class="login-input"
          placeholder="선호하는 운동 요일"
        />

        <!-- 선호하는 운동 시간대 -->
        <input
          type="text"
          id="timeInput"
          class="login-input"
          placeholder="선호하는 운동 시간대"
        />

        <!-- 회원가입하기 버튼 -->
        <a href="survey1.html" id="signupButton" class="signup-btn">
          <img
            id="signupImage"
            src="../images/signup_off.png"
            alt="회원가입하기"
          />
        </a>
      </div>
    </main>

    <!-- 자바스크립트 파일 연결 -->
    <script src="../js/signup3.js"></script>
  </body>
</html>
