<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint 사용자 등록하기</title>
    <link rel="stylesheet" href="../css/signup3.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- 상단 타이틀 -->
      <h1 class="title">사용자 등록하기</h1>

      <!-- 입력 영역 -->
      <div class="login-form">
        <!-- 성별 선택 탭 -->
        <div class="gender-container">
          <button type="button" id="maleBtn" class="gender-btn active">
            남성
          </button>
          <button type="button" id="femaleBtn" class="gender-btn">여성</button>
        </div>

        <!-- 나이 -->
        <input
          type="number"
          id="ageInput" min="1" max="120" step="1" required
          class="login-input"
          placeholder="나이"
        />

        <!-- 키 -->
        <div class="input-suffix-wrap">
          <input
            type="number"
            id="heightInput" min="1" max="300" step="0.1" required
            class="login-input"
            placeholder="키"
          />
          <span class="suffix">cm</span>
        </div>

        <!-- 몸무게 -->
        <div class="input-suffix-wrap">
          <input
            type="number"
            id="weightInput" min="1" max="500" step="0.1" required
            class="login-input"
            placeholder="몸무게"
          />
          <span class="suffix">kg</span>
        </div>

        <!-- 운동 지역 선택 -->
        <div class="select-field">
          <button type="button" id="regionInput" class="login-input select-trigger" data-target="region-panel" data-placeholder="운동 지역 선택" aria-expanded="false" aria-controls="region-panel">운동 지역 선택</button>
          <div class="select-panel region-panel" id="region-panel">
            <button type="button">서울</button>
            <button type="button">경기</button>
            <button type="button">인천</button>
            <button type="button">부산</button>
            <button type="button">대구</button>
            <button type="button">대전</button>
            <button type="button">광주</button>
            <button type="button">울산</button>
            <button type="button">세종</button>
          </div>
        </div>

        <!-- 선호하는 운동 요일 -->
        <div class="select-field">
          <button type="button" id="dayInput" class="login-input select-trigger" data-target="day-panel" data-placeholder="선호하는 운동 요일" aria-expanded="false" aria-controls="day-panel">선호하는 운동 요일</button>
          <div class="select-panel day-panel" id="day-panel">
            <button type="button" data-value="월">월</button>
            <button type="button" data-value="화">화</button>
            <button type="button" data-value="수">수</button>
            <button type="button" data-value="목">목</button>
            <button type="button" data-value="금">금</button>
            <button type="button" data-value="토">토</button>
            <button type="button" data-value="일">일</button>
          </div>
        </div>

        <!-- 선호하는 운동 시간대 -->
        <div class="select-field">
          <button type="button" id="timeInput" class="login-input select-trigger" data-target="time-panel" data-placeholder="선호하는 운동 시간대" aria-expanded="false" aria-controls="time-panel">선호하는 운동 시간대</button>
          <div class="select-panel time-panel" id="time-panel">
            <button type="button" data-value="06시">06시</button>
            <button type="button" data-value="07시">07시</button>
            <button type="button" data-value="08시">08시</button>
            <button type="button" data-value="09시">09시</button>
            <button type="button" data-value="10시">10시</button>
            <button type="button" data-value="11시">11시</button>
            <button type="button" data-value="12시">12시</button>
            <button type="button" data-value="13시">13시</button>
            <button type="button" data-value="14시">14시</button>
            <button type="button" data-value="15시">15시</button>
            <button type="button" data-value="16시">16시</button>
            <button type="button" data-value="17시">17시</button>
            <button type="button" data-value="18시">18시</button>
            <button type="button" data-value="19시">19시</button>
            <button type="button" data-value="20시">20시</button>
            <button type="button" data-value="21시">21시</button>
            <button type="button" data-value="22시">22시</button>
            <button type="button" data-value="23시">23시</button>
            <button type="button" data-value="24시">24시</button>
          </div>
        </div>

        <!-- 회원가입하기 버튼 -->
        <a href="#" id="signupButton" class="signup-btn">
          <img
            id="signupImage"
            src="../images/signup_off.png"
            alt="회원가입하기"
          />
        </a>
      </div>
    </main>

    <!-- 인터랙션 및 버튼 활성화 스크립트 -->
    <script src="../js/profile-select.js" defer></script>
    <script src="../js/signup-profile.js" defer></script>
  </body>
</html>
