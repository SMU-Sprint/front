<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>새 비밀번호 설정</title>
    <link rel="stylesheet" href="../css/reset_password.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- 로고 -->
      <img src="../images/logo.png" alt="Sprint 로고" class="logo" />

      <!-- 입력 영역 -->
      <div class="login-form">
        <!-- 새 비밀번호 입력 -->
        <input
          type="password"
          id="newPassword"
          class="login-input"
          placeholder="새 비밀번호"
        />

        <!-- 새 비밀번호 확인 입력 -->
        <input
          type="password"
          id="confirmPassword"
          class="login-input"
          placeholder="새 비밀번호 확인"
        />
        <span id="errorMsg" class="error-message"
          >비밀번호가 일치하지 않습니다.</span
        >

        <!-- 다음 버튼 -->
        <a href="#" id="nextButton" class="next-button">
          <img id="nextImage" src="../images/next_off.png" alt="다음" />
        </a>
      </div>

      <!-- 구분선 -->
      <div class="divider"></div>

      <!-- 소셜 로그인 -->
      <div class="social-login">
        <button class="social-button">
          <img src="../images/kakao-login.png" alt="카카오 로그인" />
        </button>

        <button class="social-button">
          <img src="../images/naver-login.png" alt="네이버 로그인" />
        </button>
      </div>

      <!-- 구분선 -->
      <div class="divider bottom-divider"></div>

      <!-- 하단 링크 -->
      <div class="bottom-links">
        <a href="login.html" class="signup-link"> 로그인 바로가기 </a>
        <a href="signup1.html" class="password-link"> 회원가입 바로가기 </a>
      </div>
    </main>

    <!-- 자바스크립트 파일 연결 -->
    <script src="../js/reset_password.js"></script>
  </body>
</html>
