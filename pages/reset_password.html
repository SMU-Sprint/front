<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>새 비밀번호 설정</title>
    <link rel="stylesheet" href="../css/reset_password.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- 로고 -->
      <img src="../images/logo.png" alt="Sprint 로고" class="logo" />

      <!-- 입력 영역 -->
      <div class="login-form">
        <!-- 새 비밀번호 입력 -->
        <input
          type="password"
          id="newPassword"
          class="login-input"
          placeholder="새 비밀번호"
        />

        <!-- 새 비밀번호 확인 입력 -->
        <input
          type="password"
          id="confirmPassword"
          class="login-input"
          placeholder="새 비밀번호 확인"
        />
        <span id="errorMsg" class="error-message"
          >비밀번호가 일치하지 않습니다.</span
        >

        <!-- 다음 버튼 -->
        <a href="login.html" id="nextButton" class="next-button">
          <img id="nextImage" src="../images/next_off.png" alt="다음" />
        </a>
      </div>

      <!-- 구분선 -->
      <div class="divider"></div>

      <!-- 소셜 로그인 -->
      <div class="social-login">
        <button class="social-button">
          <img src="../images/kakao-login.png" alt="카카오 로그인" />
        </button>

        <button class="social-button">
          <img src="../images/naver-login.png" alt="네이버 로그인" />
        </button>
      </div>

      <!-- 구분선 -->
      <div class="divider bottom-divider"></div>

      <!-- 하단 링크 -->
      <div class="bottom-links">
        <a href="login.html" class="signup-link"> 로그인 바로가기 </a>
        <a href="signup1.html" class="password-link"> 회원가입 바로가기 </a>
      </div>
    </main>

    <!-- 인터랙션 및 유효성 검사 스크립트 -->
    <script>
      const newPassword = document.getElementById("newPassword");
      const confirmPassword = document.getElementById("confirmPassword");
      const errorMsg = document.getElementById("errorMsg");
      const nextButton = document.getElementById("nextButton");
      const nextImage = document.getElementById("nextImage");

      function updateState() {
        const val1 = newPassword.value;
        const val2 = confirmPassword.value;

        // 1. 첫 번째 입력창 테두리 제어 (입력되면 초록색)
        if (val1.trim() !== "") {
          newPassword.classList.add("active");
        } else {
          newPassword.classList.remove("active");
        }

        // 2. 두 번째 입력창 테두리 제어 (입력되면 초록색)
        if (val2.trim() !== "") {
          confirmPassword.classList.add("active");
        } else {
          confirmPassword.classList.remove("active");
        }

        // 3. 일치 여부 및 버튼 활성화 검증
        if (val2.trim() !== "" && val1 !== val2) {
          errorMsg.classList.add("show");
          nextImage.src = "../images/next_off.png";
        } else {
          errorMsg.classList.remove("show");
          // 둘 다 비어있지 않고 값이 같을 때만 다음 버튼 활성화
          if (val1 !== "" && val1 === val2) {
            nextImage.src = "../images/next_on.png";
          } else {
            nextImage.src = "../images/next_off.png";
          }
        }
      }

      newPassword.addEventListener("input", updateState);
      confirmPassword.addEventListener("input", updateState);

      // 검증되지 않았을 때 다음 버튼 클릭 방지
      nextButton.addEventListener("click", function (e) {
        if (
          newPassword.value === "" ||
          newPassword.value !== confirmPassword.value
        ) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
