<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" href="../css/find_password.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- 로고 -->
      <img src="../images/logo.png" alt="Sprint 로고" class="logo" />

      <!-- 입력 영역 -->
      <div class="login-form">
        <!-- 이메일 입력 그룹 -->
        <div class="input-row">
          <input
            type="email"
            id="emailInput"
            class="login-input"
            placeholder="이메일"
          />
          <button type="button" id="authRequestBtn" class="side-button">
            인증번호 받기
          </button>
        </div>

        <!-- 인증번호 입력 그룹 -->
        <div class="input-row">
          <input
            type="text"
            id="codeInput"
            class="login-input"
            placeholder="인증번호"
          />
          <button type="button" id="authConfirmBtn" class="side-button">
            인증번호 확인
          </button>
        </div>
        <span id="errorMsg" class="error-message"
          >인증번호가 일치하지 않습니다.</span
        >

        <!-- 다음 버튼 -->
        <a href="reset_password.html" id="nextButton" class="next-button">
          <img id="nextImage" src="../images/next_off.png" alt="다음" />
        </a>
      </div>

      <!-- 구분선 -->
      <div class="divider"></div>

      <!-- 소셜 로그인 -->
      <div class="social-login">
        <button class="social-button">
          <img src="../images/kakao-login.png" alt="카카오 로그인" />
        </button>

        <button class="social-button">
          <img src="../images/naver-login.png" alt="네이버 로그인" />
        </button>
      </div>

      <!-- 구분선 -->
      <div class="divider bottom-divider"></div>

      <!-- 하단 링크 -->
      <div class="bottom-links">
        <a href="login.html" class="signup-link"> 로그인 바로가기 </a>
        <a href="signup1.html" class="password-link"> 회원가입 바로가기 </a>
      </div>
    </main>

    <!-- 인터랙션 및 버튼 활성화 스크립트 -->
    <script>
      const emailInput = document.getElementById("emailInput");
      const authRequestBtn = document.getElementById("authRequestBtn");
      const codeInput = document.getElementById("codeInput");
      const authConfirmBtn = document.getElementById("authConfirmBtn");
      const errorMsg = document.getElementById("errorMsg");
      const nextButton = document.getElementById("nextButton");
      const nextImage = document.getElementById("nextImage");

      // 1. 이메일 입력 시 초록색으로 변경 및 인증번호 받기 버튼 활성화
      emailInput.addEventListener("input", function () {
        if (emailInput.value.trim() !== "") {
          emailInput.classList.add("active");
          authRequestBtn.classList.add("active");
        } else {
          emailInput.classList.remove("active");
          authRequestBtn.classList.remove("active");
        }
      });

      // 2. 인증번호 입력 시 초록색으로 변경 및 인증번호 확인 버튼 활성화
      codeInput.addEventListener("input", function () {
        if (codeInput.value.trim() !== "") {
          codeInput.classList.add("active");
          authConfirmBtn.classList.add("active");
        } else {
          codeInput.classList.remove("active");
          authConfirmBtn.classList.remove("active");
        }
      });

      // 3. 인증번호 확인 버튼 클릭 시 (임시로 '1234'를 정답으로 설정)
      // 틀리면 경고문구 출력 및 다음 버튼 off, 맞으면 경고문구 숨기고 다음 버튼 on
      const correctCode = "1234";
      let isVerified = false;

      authConfirmBtn.addEventListener("click", function () {
        if (codeInput.value.trim() === correctCode) {
          errorMsg.classList.remove("show");
          isVerified = true;
          nextImage.src = "../images/next.on.png"; // 다음 버튼 활성화
        } else {
          errorMsg.classList.add("show");
          isVerified = false;
          nextImage.src = "../images/next_off.png"; // 다음 버튼 비활성화
        }
      });

      // 4. 인증이 완료되지 않았을 때 다음 버튼을 누르면 이동을 막음
      nextButton.addEventListener("click", function (e) {
        if (!isVerified) {
          e.preventDefault();
          alert("인증번호 확인이 필요합니다.");
        }
      });
    </script>
  </body>
</html>
