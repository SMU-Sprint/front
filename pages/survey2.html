<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>국제신체활동1 설문</title>
    <link rel="stylesheet" href="../css/survey2.css" />
    <script src="../js/survey-storage.js"></script>
  </head>

  <body>
    <main class="survey-container">
      <!-- 상단 단계별 네비게이션 바 (클릭 이동 가능) -->
      <nav class="step-nav">
        <a href="survey1.html" class="step-item">운동동기</a>
        <a href="survey2.html" class="step-item active">국제신체활동1</a>
        <a href="survey3.html" class="step-item">국제신체활동2</a>
        <a href="survey4.html" class="step-item">노쇠설문</a>
        <a href="survey5.html" class="step-item">추천 운동</a>
      </nav>

      <!-- 설문 폼 박스 -->
      <form id="surveyForm" action="survey3.html" class="survey-box">
        <!-- 1번 문항: 직업 특성 (단일 선택 - 라디오) -->
        <div class="question-group">
          <p class="question-title">직업 특성이 어떻습니까?</p>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="radio" name="job" value="활동적" />
              <span class="custom-box radio-box"></span> 활동적(예: 단순노무직,
              판매직 등)
            </label>
            <label class="checkbox-label">
              <input type="radio" name="job" value="비활동적" />
              <span class="custom-box radio-box"></span> 비활동적(예: 행정직,
              사무직 등)
            </label>
            <label class="checkbox-label">
              <input type="radio" name="job" value="기타" />
              <span class="custom-box radio-box"></span> 기타(예: 주부, 학생,
              무직 등)
            </label>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 2번 문항: 주로 운동하는 장소 (텍스트 입력) -->
        <div class="question-group">
          <p class="question-title">주로 운동하는 장소가 어디입니까?</p>
          <input
            type="text"
            id="locationInput"
            class="login-input"
            placeholder="타이핑"
          />
        </div>

        <div class="divider"></div>

        <!-- 3번 문항: 선호하는 스포츠 (중복 가능) -->
        <div class="question-group">
          <p class="question-title">
            선호하는 스포츠는 무엇입니까? (중복 가능)
          </p>
          <div class="sports-grid">
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="축구" />
              <span class="custom-box"></span> 축구
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="농구" />
              <span class="custom-box"></span> 농구
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="배드민턴" />
              <span class="custom-box"></span> 배드민턴
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="탁구" />
              <span class="custom-box"></span> 탁구
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="족구" />
              <span class="custom-box"></span> 족구
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="볼링" />
              <span class="custom-box"></span> 볼링
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="수영" />
              <span class="custom-box"></span> 수영
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="테니스" />
              <span class="custom-box"></span> 테니스
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="야구" />
              <span class="custom-box"></span> 야구
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="런닝" />
              <span class="custom-box"></span> 런닝
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="스케이트" />
              <span class="custom-box"></span> 스케이트
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="자전거 라이딩" />
              <span class="custom-box"></span> 자전거 라이딩
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="sports" value="기타" />
              <span class="custom-box"></span> 기타
            </label>
          </div>
        </div>
      </form>

      <!-- 하단 다음 버튼 -->
      <div class="button-wrapper">
        <button type="button" id="nextBtn" class="next-btn off" disabled>
          다음
        </button>
      </div>
    </main>

    <!-- 유효성 검사 및 버튼 활성화 스크립트 -->
    <script>
      const locationInput = document.getElementById("locationInput");
      const nextBtn = document.getElementById("nextBtn");

      function checkFormValidation() {
        const jobChecked =
          document.querySelectorAll('input[name="job"]:checked').length > 0;
        const locationVal = locationInput.value.trim() !== "";
        const sportsChecked =
          document.querySelectorAll('input[name="sports"]:checked').length > 0;

        // 1번 라디오, 2번 인풋, 3번 체크박스(최소 1개) 모두 충족될 때 활성화
        if (jobChecked && locationVal && sportsChecked) {
          nextBtn.classList.remove("off");
          nextBtn.classList.add("on");
          nextBtn.removeAttribute("disabled");
        } else {
          nextBtn.classList.remove("on");
          nextBtn.classList.add("off");
          nextBtn.setAttribute("disabled", "true");
        }
      }

      locationInput.addEventListener("input", function () {
        if (this.value.trim() !== "") {
          this.classList.add("active");
        } else {
          this.classList.remove("active");
        }
        checkFormValidation();
      });

      const allInputs = document.querySelectorAll(
        'input[type="checkbox"], input[type="radio"]',
      );
      allInputs.forEach((input) => {
        input.addEventListener("change", checkFormValidation);
      });

      restoreSurveyStep("survey2");
      if (locationInput.value.trim() !== "") {
        locationInput.classList.add("active");
      }
      checkFormValidation();

      nextBtn.addEventListener("click", function () {
        if (!nextBtn.hasAttribute("disabled")) {
          saveSurveyStep("survey2");
          window.location.href = "survey3.html";
        }
      });
    </script>
  </body>
</html>
