<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>국제신체활동1 설문</title>
    <link rel="stylesheet" href="../css/survey2.css" />
  </head>

  <body>
    <main class="survey-container">
      <nav class="step-nav">
        <a href="survey1.html" class="step-item">운동동기</a>
        <a href="survey2.html" class="step-item active">국제신체활동1</a>
        <a href="survey3.html" class="step-item">국제신체활동2</a>
        <a href="survey4.html" class="step-item">노쇠설문</a>
        <a href="survey5.html" class="step-item">추천 운동</a>
      </nav>

      <form id="surveyForm" class="survey-box">
        <div class="question-group">
          <p class="question-title">직업 특성이 어떻습니까?</p>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="radio" name="job" value="활동" />
              <span class="custom-box radio-box"></span> 활동적(예: 단순노무직,
              판매직 등)
            </label>
            <label class="checkbox-label">
              <input type="radio" name="job" value="비활동" />
              <span class="custom-box radio-box"></span> 비활동적(예: 행정직,
              사무직 등)
            </label>
          </div>
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">주로 운동하는 장소가 어디입니까?</p>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="radio" name="spot" value="종목_특화_운동장" />
              <span class="custom-box radio-box"></span> 종목 특화 운동장
            </label>
            <label class="checkbox-label">
              <input type="radio" name="spot" value="산책로" />
              <span class="custom-box radio-box"></span> 산책로
            </label>
            <label class="checkbox-label">
              <input type="radio" name="spot" value="공터" />
              <span class="custom-box radio-box"></span> 공터
            </label>
            <label class="checkbox-label">
              <input type="radio" name="spot" value="학교_체육시설" />
              <span class="custom-box radio-box"></span> 학교 체육시설
            </label>
            <label class="checkbox-label">
              <input type="radio" name="spot" value="기타" />
              <span class="custom-box radio-box"></span> 기타
            </label>
          </div>
          <input
            type="text"
            id="exerciseSpotEtcInput"
            class="login-input"
            placeholder="기타 운동 장소를 입력해 주세요"
            maxlength="100"
            hidden
          />
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">
            가장 선호하는 스포츠는 무엇입니까?
          </p>
          <div class="sports-grid">
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="축구" /><span
                class="custom-box radio-box"
              ></span>
              축구</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="농구" /><span
                class="custom-box radio-box"
              ></span>
              농구</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="배드민턴" /><span
                class="custom-box radio-box"
              ></span>
              배드민턴</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="탁구" /><span
                class="custom-box radio-box"
              ></span>
              탁구</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="족구" /><span
                class="custom-box radio-box"
              ></span>
              족구</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="볼링" /><span
                class="custom-box radio-box"
              ></span>
              볼링</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="수영" /><span
                class="custom-box radio-box"
              ></span>
              수영</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="테니스" /><span
                class="custom-box radio-box"
              ></span>
              테니스</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="야구" /><span
                class="custom-box radio-box"
              ></span>
              야구</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="런닝" /><span
                class="custom-box radio-box"
              ></span>
              런닝</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="스케이트" /><span
                class="custom-box radio-box"
              ></span>
              스케이트</label
            >
            <label class="checkbox-label"
              ><input
                type="radio"
                name="sports"
                value="자전거 라이딩"
              /><span class="custom-box radio-box"></span> 자전거 라이딩</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="sports" value="기타" /><span
                class="custom-box radio-box"
              ></span>
              기타</label
            >
          </div>
        </div>
      </form>

      <div class="button-wrapper">
        <button type="button" id="nextBtn" class="next-btn off" disabled>
          다음
        </button>
      </div>
    </main>

    <script src="../js/survey-storage.js"></script>
    <script src="../js/survey2.js"></script>
  </body>
</html>
