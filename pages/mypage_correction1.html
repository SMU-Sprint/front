<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint | 정보 수정 인증</title>
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/mypage_correction1.css" />
    <script src="../js/app.js" defer></script>
  </head>
  <body data-page="mypage-correction1">
    <div id="sidebar-container"></div>
    <main class="app-shell correction-auth">
      <section class="auth-box">
        <h1>정보 수정하기</h1>
        <div class="auth-row">
          <input type="email" id="email" placeholder="이메일" />
          <button type="button" id="send-code-btn" class="auth-btn">
            인증번호 받기
          </button>
        </div>

        <div class="auth-row">
          <input
            type="text"
            id="verification-code"
            placeholder="인증번호"
            disabled
          />
          <button type="button" id="verify-code-btn" class="auth-btn" disabled>
            인증번호 확인
          </button>
        </div>

        <button type="button" id="next-btn" class="next" disabled>다음</button>
      </section>
    </main>

    <!-- 외부 자바스크립트 파일 연결 -->
    <script src="../js/mypage_correction1.js" defer></script>
  </body>
</html>
