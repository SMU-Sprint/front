<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint | 정보 수정 인증</title>
    <link rel="stylesheet" href="../css/sidebar.css" />

    <script src="../js/app.js" defer></script>
    <link rel="stylesheet" href="../css/verification.css" />
    <link rel="stylesheet" href="../css/mypage_correction1.css" />
  </head>
  <body data-page="mypage-correction1">
    <div id="sidebar-container"></div>
    <main class="app-shell correction-auth">
      <section class="auth-box">
        <h1>정보 수정하기</h1>
      <div class="login-form correction-verification">
        <!-- 이메일 입력 그룹 -->
        <div class="input-row">
          <input
            type="email"
            id="emailInput"
            class="login-input"
            placeholder="이메일"
          />
          <button type="button" id="authRequestBtn" class="side-button">
            인증번호 받기
          </button>
        </div>

        <!-- 인증번호 입력 그룹 -->
        <div class="input-row">
          <input
            type="text"
            id="codeInput"
            class="login-input"
            placeholder="인증번호"
          />
          <button type="button" id="authConfirmBtn" class="side-button">
            인증번호 확인
          </button>
        </div>
        <span id="errorMsg" class="error-message"
          >인증번호가 일치하지 않습니다.</span
        >

        <!-- 다음 버튼 -->
        <a href="mypage_correction2.html" id="nextButton" class="next-button">
          <img id="nextImage" src="../images/next_off.png" alt="다음" />
        </a>
      </div>


      </section>
    </main>
  <script src="../js/verification.js" defer></script>
  </body>
</html>
