<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>운동동기 설문</title>
    <link rel="stylesheet" href="../css/survey1.css" />
  </head>

  <body>
    <main class="survey-container">
      <nav class="step-nav">
        <a href="survey1.html" class="step-item active">운동동기</a>
        <a href="survey2.html" class="step-item">국제신체활동1</a>
        <a href="survey3.html" class="step-item">국제신체활동2</a>
        <a href="survey4.html" class="step-item">노쇠설문</a>
        <a href="survey5.html" class="step-item">추천 운동</a>
      </nav>

      <form id="surveyForm" class="survey-box">
        <div class="question-group">
          <p class="question-title">운동 목적이 무엇입니까?</p>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="checkbox" name="purpose" value="다이어트" />
              <span class="custom-box"></span> 다이어트
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose" value="질환예방" />
              <span class="custom-box"></span> 질환예방
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose" value="체력측정" />
              <span class="custom-box"></span> 체력측정(채용)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="purpose" value="기타" />
              <span class="custom-box"></span> 기타
            </label>
          </div>
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">과거에 운동에 참여한 경험이 있습니까?</p>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="radio" name="experience" value="있다" />
              <span class="custom-box radio-box"></span> 있다
            </label>
            <label class="checkbox-label">
              <input type="radio" name="experience" value="없다" />
              <span class="custom-box radio-box"></span> 없다
            </label>
          </div>
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">운동에 제약사항이 있습니까?</p>
          <div class="options-grid">
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="심장질환" />
              <span class="custom-box"></span> 심장질환
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="어지럼증" />
              <span class="custom-box"></span> 어지럼증
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="허리통증" />
              <span class="custom-box"></span> 허리통증
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="무릎 및 발목통증" />
              <span class="custom-box"></span> 무릎 및 발목통증
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="어깨 및 손목통증" />
              <span class="custom-box"></span> 어깨 및 손목통증
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="고혈압" />
              <span class="custom-box"></span> 고혈압
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="기타" />
              <span class="custom-box"></span> 기타
            </label>
          </div>
        </div>
      </form>

      <div class="button-wrapper">
        <button type="button" id="nextBtn" class="next-btn off" disabled>
          다음
        </button>
      </div>
    </main>

    <script src="../js/survey-storage.js"></script>
    <script src="../js/survey1.js"></script>
  </body>
</html>
