<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>운동동기 설문</title>
    <link rel="stylesheet" href="../css/survey1.css" />
  </head>

  <body>
    <main class="survey-container">
      <nav class="step-nav">
        <a href="survey1.html" class="step-item active">운동동기</a>
        <a href="survey2.html" class="step-item">국제신체활동1</a>
        <a href="survey3.html" class="step-item">국제신체활동2</a>
        <a href="survey4.html" class="step-item">노쇠설문</a>
        <a href="survey5.html" class="step-item">추천 운동</a>
      </nav>

      <form id="surveyForm" class="survey-box">
        <div class="question-group">
          <p class="question-title">운동 목적이 무엇입니까?</p>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="radio" name="purpose" value="다이어트" />
              <span class="custom-box radio-box"></span> 다이어트
            </label>
            <label class="checkbox-label">
              <input type="radio" name="purpose" value="체형관리" />
              <span class="custom-box radio-box"></span> 체형관리
            </label>
            <label class="checkbox-label">
              <input type="radio" name="purpose" value="질병예방" />
              <span class="custom-box radio-box"></span> 질병예방
            </label>
            <label class="checkbox-label">
              <input type="radio" name="purpose" value="체력증진" />
              <span class="custom-box radio-box"></span> 체력증진
            </label>
            <label class="checkbox-label">
              <input type="radio" name="purpose" value="기타" />
              <span class="custom-box radio-box"></span> 기타
            </label>
          </div>
          <input
            type="text"
            id="purposeEtcInput"
            class="detail-input"
            placeholder="기타 운동 목적을 입력해 주세요"
            maxlength="100"
            hidden
          />
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">과거에 운동에 참여한 경험이 있습니까?</p>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="radio" name="experience" value="있다" />
              <span class="custom-box radio-box"></span> 있다
            </label>
            <label class="checkbox-label">
              <input type="radio" name="experience" value="없다" />
              <span class="custom-box radio-box"></span> 없다
            </label>
          </div>
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">
            운동을 지속하기 어려운 점은 무엇입니까? (중복 가능)
          </p>
          <div class="options-grid">
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="시간부족" />
              <span class="custom-box"></span> 시간 부족
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="과도한업무" />
              <span class="custom-box"></span> 과도한 업무
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="경제적비용" />
              <span class="custom-box"></span> 경제적 비용
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="효과의불확실성" />
              <span class="custom-box"></span> 효과의 불확실성
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="운동방법의어려움" />
              <span class="custom-box"></span> 운동 방법의 어려움
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="흥미의부재" />
              <span class="custom-box"></span> 흥미의 부재
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="부상이나통증" />
              <span class="custom-box"></span> 부상이나 통증
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="환경문제" />
              <span class="custom-box"></span> 환경 문제
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="limit" value="기타" />
              <span class="custom-box"></span> 기타
            </label>
          </div>
          <input
            type="text"
            id="constraintEtcInput"
            class="detail-input"
            placeholder="기타 어려운 점을 입력해 주세요"
            maxlength="100"
            hidden
          />
        </div>
      </form>

      <div class="button-wrapper">
        <button type="button" id="nextBtn" class="next-btn off" disabled>
          다음
        </button>
      </div>
    </main>

    <script src="../js/survey-storage.js"></script>
    <script src="../js/survey1.js"></script>
  </body>
</html>
