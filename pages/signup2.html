<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사용자 등록하기</title>
    <link rel="stylesheet" href="../css/signup2.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- 상단 타이틀 -->
      <h1 class="title">사용자 등록하기</h1>

      <!-- 입력 영역 -->
      <div class="login-form">
        <!-- 이메일 -->
        <input
          type="email"
          id="emailInput"
          class="login-input"
          placeholder="이메일"
        />

        <!-- 이름 -->
        <input
          type="text"
          id="nameInput"
          class="login-input"
          placeholder="이름"
        />

        <!-- 비밀번호 -->
        <input
          type="password"
          id="passwordInput"
          class="login-input"
          placeholder="비밀번호"
        />

        <!-- 비밀번호 확인 -->
        <input
          type="password"
          id="confirmInput"
          class="login-input"
          placeholder="비밀번호 확인"
        />
        <span id="errorMsg" class="error-message"
          >비밀번호가 일치하지 않습니다.</span
        >
        <!-- 우측 정렬 동의 체크박스 영역 -->
        <div class="agreement-container">
          <label class="agreement-label">
            <input
              type="checkbox"
              id="privacyCheck"
              class="agreement-checkbox"
            />
            <span class="custom-checkbox"></span>
            개인정보 제공 동의
          </label>
          <label class="agreement-label">
            <input
              type="checkbox"
              id="locationCheck"
              class="agreement-checkbox"
            />
            <span class="custom-checkbox"></span>
            위치서비스 제공 동의
          </label>
        </div>
        <!-- 다음 버튼 (a 태그 대신 일반 버튼 또는 폼 제출 형태로 백엔드 통신 처리) -->
        <button type="button" id="nextButton" class="next-button">
          <img id="nextImage" src="../images/next_off.png" alt="다음" />
        </button>
      </div>
    </main>

    <!-- 외부 자바스크립트 파일 연결 -->
    <script src="../js/signup2.js"></script>
  </body>
</html>
