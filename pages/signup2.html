<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사용자 등록하기</title>
    <link rel="stylesheet" href="../css/signup2.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- 상단 타이틀 -->
      <h1 class="title">사용자 등록하기</h1>

      <!-- 입력 영역 -->
      <div class="login-form">
        <!-- 이메일 -->
        <input
          type="email"
          id="emailInput"
          class="login-input"
          placeholder="이메일"
        />

        <!-- 이름 -->
        <input
          type="text"
          id="nameInput"
          class="login-input"
          placeholder="이름"
        />

        <!-- 비밀번호 -->
        <input
          type="password"
          id="passwordInput"
          class="login-input"
          placeholder="비밀번호"
        />

        <!-- 비밀번호 확인 -->
        <input
          type="password"
          id="confirmInput"
          class="login-input"
          placeholder="비밀번호 확인"
        />
        <span id="errorMsg" class="error-message"
          >비밀번호가 일치하지 않습니다.</span
        >
        <!-- 우측 정렬 동의 체크박스 영역 -->
        <div class="agreement-container">
          <label class="agreement-label">
            <input
              type="checkbox"
              id="privacyCheck"
              class="agreement-checkbox"
            />
            <span class="custom-checkbox"></span>
            개인정보 제공 동의
          </label>
          <label class="agreement-label">
            <input
              type="checkbox"
              id="locationCheck"
              class="agreement-checkbox"
            />
            <span class="custom-checkbox"></span>
            위치서비스 제공 동의
          </label>
        </div>
        <!-- 다음 버튼 -->
        <a href="signup3.html" id="nextButton" class="next-button">
          <img id="nextImage" src="../images/next_off.png" alt="다음" />
        </a>
      </div>
    </main>

    <!-- 네 칸 입력 및 버튼 상태 제어 스크립트 -->
    <!-- 네 칸 입력, 비밀번호 일치 및 동의 체크박스 상태 제어 스크립트 -->
    <script>
      const emailInput = document.getElementById("emailInput");
      const nameInput = document.getElementById("nameInput");
      const passwordInput = document.getElementById("passwordInput");
      const confirmInput = document.getElementById("confirmInput");
      const privacyCheck = document.getElementById("privacyCheck");
      const locationCheck = document.getElementById("locationCheck");

      const errorMsg = document.getElementById("errorMsg");
      const nextButton = document.getElementById("nextButton");
      const nextImage = document.getElementById("nextImage");

      const inputs = [emailInput, nameInput, passwordInput, confirmInput];

      function updateFormState() {
        // 1. 각 입력창별 active(초록색 테두리) 처리
        inputs.forEach((input) => {
          if (input.value.trim() !== "") {
            input.classList.add("active");
          } else {
            input.classList.remove("active");
          }
        });

        const emailVal = emailInput.value.trim();
        const nameVal = nameInput.value.trim();
        const pwdVal = passwordInput.value.trim();
        const confirmVal = confirmInput.value.trim();
        const isPrivacyChecked = privacyCheck.checked;
        const isLocationChecked = locationCheck.checked;

        // 2. 비밀번호와 비밀번호 확인 일치 여부 검증
        if (confirmVal !== "" && pwdVal !== confirmVal) {
          errorMsg.classList.add("show");
        } else {
          errorMsg.classList.remove("show");
        }

        // 3. 네 칸 모두 입력 + 비밀번호 일치 + 두 동의 체크박스가 모두 체크될 때만 다음 버튼 활성화
        if (
          emailVal !== "" &&
          nameVal !== "" &&
          pwdVal !== "" &&
          confirmVal !== "" &&
          pwdVal === confirmVal &&
          isPrivacyChecked &&
          isLocationChecked
        ) {
          nextImage.src = "../images/next_on.png";
        } else {
          nextImage.src = "../images/next_off.png";
        }
      }

      // 입력창 값 변경 시 상태 업데이트
      inputs.forEach((input) => {
        input.addEventListener("input", updateFormState);
      });

      // 체크박스 상태 변경 시 상태 업데이트
      privacyCheck.addEventListener("change", updateFormState);
      locationCheck.addEventListener("change", updateFormState);

      // 조건이 맞지 않을 때 다음 버튼 클릭 방지
      nextButton.addEventListener("click", function (e) {
        const emailVal = emailInput.value.trim();
        const nameVal = nameInput.value.trim();
        const pwdVal = passwordInput.value.trim();
        const confirmVal = confirmInput.value.trim();

        if (
          emailVal === "" ||
          nameVal === "" ||
          pwdVal === "" ||
          confirmVal !== pwdVal ||
          !privacyCheck.checked ||
          !locationCheck.checked
        ) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
