<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>노쇠설문</title>
    <link rel="stylesheet" href="../css/survey4.css" />
    <script src="../js/survey-storage.js"></script>
  </head>

  <body>
    <main class="survey-container">
      <nav class="step-nav">
        <a href="survey1.html" class="step-item">운동동기</a>
        <a href="survey2.html" class="step-item">국제신체활동1</a>
        <a href="survey3.html" class="step-item">국제신체활동2</a>
        <a href="survey4.html" class="step-item active">노쇠설문</a>
        <a href="survey5.html" class="step-item">추천 운동</a>
      </nav>

      <form id="surveyForm" class="survey-box">
        <div class="question-group">
          <p class="question-title">
            지난 한 달 동안 피곤하다고 느낀 적이 있습니까?(항상 또는 거의
            대부분인 경우)
          </p>
          <div class="options-row">
            <label class="checkbox-label"
              ><input type="radio" name="fatigue" value="true" /><span
                class="custom-box radio-box"
              ></span>
              예</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="fatigue" value="false" /><span
                class="custom-box radio-box"
              ></span>
              아니오</label
            >
          </div>
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">
            도움 없이 혼자서 쉬지 않고 10개의 계단을 오르는데 힘이 듭니까?
          </p>
          <div class="options-row">
            <label class="checkbox-label"
              ><input type="radio" name="stairs" value="true" /><span
                class="custom-box radio-box"
              ></span>
              예</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="stairs" value="false" /><span
                class="custom-box radio-box"
              ></span>
              아니오</label
            >
          </div>
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">
            도움 없이 300미터를 혼자서 이동하는데 힘이 듭니까?
          </p>
          <div class="options-row">
            <label class="checkbox-label"
              ><input type="radio" name="walking" value="true" /><span
                class="custom-box radio-box"
              ></span>
              예</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="walking" value="false" /><span
                class="custom-box radio-box"
              ></span>
              아니오</label
            >
          </div>
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">1년 전과 비교해 체중이 5% 이상 감소했다.</p>
          <div class="options-row">
            <label class="checkbox-label"
              ><input type="radio" name="weight" value="true" /><span
                class="custom-box radio-box"
              ></span>
              예</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="weight" value="false" /><span
                class="custom-box radio-box"
              ></span>
              아니오</label
            >
          </div>
        </div>
      </form>

      <div class="button-wrapper">
        <button type="button" id="nextBtn" class="next-btn off" disabled>
          제출하기
        </button>
      </div>
    </main>

    <!-- 유효성 검사 및 버튼 활성화 스크립트 -->
    <script>
      const nextBtn = document.getElementById("nextBtn");

      function checkFormValidation() {
        const fatigueChecked =
          document.querySelectorAll('input[name="fatigue"]:checked').length > 0;
        const stairsChecked =
          document.querySelectorAll('input[name="stairs"]:checked').length > 0;
        const walkingChecked =
          document.querySelectorAll('input[name="walking"]:checked').length > 0;
        const weightChecked =
          document.querySelectorAll('input[name="weight"]:checked').length > 0;

        // 4문항 모두 선택되었을 때 다음 버튼 활성화
        if (
          fatigueChecked &&
          stairsChecked &&
          walkingChecked &&
          weightChecked
        ) {
          nextBtn.classList.remove("off");
          nextBtn.classList.add("on");
          nextBtn.removeAttribute("disabled");
        } else {
          nextBtn.classList.remove("on");
          nextBtn.classList.add("off");
          nextBtn.setAttribute("disabled", "true");
        }
      }

      const allInputs = document.querySelectorAll('input[type="radio"]');
      allInputs.forEach((input) => {
        input.addEventListener("change", checkFormValidation);
      });

      restoreSurveyStep("survey4");
      checkFormValidation();

      nextBtn.addEventListener("click", async function () {
        if (nextBtn.hasAttribute("disabled")) return;

        nextBtn.setAttribute("disabled", "true");
        nextBtn.textContent = "제출 중";

        try {
          await submitSurveyDraft("survey4");
          window.location.href = "survey5.html";
        } catch (error) {
          console.error(error);
          alert("설문 제출에 실패했습니다. 잠시 후 다시 시도해 주세요.");
          nextBtn.textContent = "제출하기";
          checkFormValidation();
        }
      });
    </script>
  </body>
</html>
