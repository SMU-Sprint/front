<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- 로고 -->
      <img src="../images/logo.png" alt="Sprint 로고" class="logo" />

      <!-- 로그인 영역 -->
      <div class="login-form">
        <!-- 이메일 -->
        <input
          type="email"
          id="emailInput"
          class="login-input"
          placeholder="이메일"
        />
        <span id="emailError" class="error-message"
          >존재하지 않는 이메일 입니다.</span
        >

        <!-- 비밀번호 -->
        <input
          type="password"
          id="passwordInput"
          class="login-input"
          placeholder="비밀번호"
        />
        <span id="passwordError" class="error-message"
          >비밀번호가 일치하지 않습니다.</span
        >

        <!-- 다음 버튼 -->
        <a href="#" id="nextButton" class="next-button">
          <img id="nextImage" src="../images/next_off.png" alt="다음" />
        </a>
      </div>

      <!-- 구분선 -->
      <div class="divider"></div>

      <!-- 소셜 로그인 -->
      <div class="social-login">
        <button class="social-button">
          <img src="../images/kakao-login.png" alt="카카오 로그인" />
        </button>

        <button class="social-button">
          <img src="../images/naver-login.png" alt="네이버 로그인" />
        </button>
      </div>

      <!-- 구분선 -->
      <div class="divider bottom-divider"></div>

      <!-- 회원가입 / 비밀번호 찾기 -->
      <div class="bottom-links">
        <a href="signup1.html" class="signup-link"> 회원가입 바로가기 </a>
        <a href="find_password.html" class="password-link"> 비밀번호 찾기 </a>
      </div>
    </main>

    <!-- 자바스크립트 파일 연결 -->
    <script src="../js/login.js"></script>
  </body>
</html>
