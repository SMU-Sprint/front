<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>추천 운동</title>
    <link rel="stylesheet" href="../css/survey5.css" />
  </head>

  <body>
    <main class="survey-container">
      <!-- 상단 단계별 네비게이션 바 -->
      <nav class="step-nav">
        <a href="survey1.html" class="step-item">운동동기</a>
        <a href="survey2.html" class="step-item">국제신체활동1</a>
        <a href="survey3.html" class="step-item">국제신체활동2</a>
        <a href="survey4.html" class="step-item">노쇠설문</a>
        <a href="survey5.html" class="step-item active">추천 운동</a>
      </nav>

      <!-- 추천 운동 내용 박스 (AI 결과가 동적으로 들어감) -->
      <div class="survey-box" id="recommendationBox">
        <div class="question-group">
          <p class="question-title">AI 운동 추천을 불러오는 중입니다...</p>
          <p class="recommend-desc">잠시만 기다려 주세요.</p>
        </div>
      </div>

      <!-- 하단 완료 버튼 (클릭 시 메인 화면으로 이동) -->
      <div class="button-wrapper">
        <button type="button" id="completeBtn" class="next-btn on">완료</button>
      </div>
    </main>

    <!-- 자바스크립트 파일 연결 -->
