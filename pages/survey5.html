<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>추천 운동</title>
    <link rel="stylesheet" href="../css/survey5.css" />

  <body>

      <!-- 추천 운동 내용 박ส -->

        <!-- 1번 추천 운동 -->
        <div class="question-group">
          <p class="question-title">1. 운동이름</p>
          <p class="recommend-desc">
            간단한 운동 설명이나 언제 하는걸 추천하는지 그런거 쓰면
            좋을것같아요.
          </p>
        </div>

        <div class="divider"></div>

        <!-- 2번 추천 운동 -->
        <div class="question-group">
          <p class="question-title">2. 운동이름</p>

      <div class="button-wrapper">
        <button type="button" id="completeBtn" class="next-btn on">완료</button>
      </div>
    </main>

    <!-- 완료 버튼 클릭 시 메인 화면(main.html) 이동 스크립트 -->
    <script>
      const completeBtn = document.getElementById("completeBtn");

      completeBtn.addEventListener("click", function () {
        window.location.href = "main.html";
      });
    </script>
