<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>추천 운동</title>
    <link rel="stylesheet" href="../css/survey5.css" />
  </head>

  <body>
    <main class="survey-container">
      <!-- 상단 단계 배너 이미지 (추천 운동 단계 강조) -->
      <img
        src="../images/survey5.png"
        alt="추천 운동 단계"
        class="survey-banner"
      />

      <!-- 추천 운동 내용 박스 -->
      <div class="survey-box">
        <!-- 1번 추천 운동 -->
        <div class="question-group">
          <p class="question-title">1. 운동이름</p>
          <p class="recommend-desc">
            간단한 운동 설명이나 언제 하는걸 추천하는지 그런거 쓰면
            좋을것같아요.
          </p>
        </div>

        <div class="divider"></div>

        <!-- 2번 추천 운동 -->
        <div class="question-group">
          <p class="question-title">2. 운동이름</p>
          <p class="recommend-desc">
            간단한 운동 설명이나 언제 하는걸 추천하는지 그런거 쓰면
            좋을것같아요.
          </p>
        </div>

        <div class="divider"></div>

        <!-- 3번 추천 운동 -->
        <div class="question-group">
          <p class="question-title">3. 운동이름</p>
          <p class="recommend-desc">
            간단한 운동 설명이나 언제 하는걸 추천하는지 그런거 쓰면
            좋을것같아요.
          </p>
        </div>
      </div>

      <!-- 하단 완료 버튼 (클릭 시 메인 화면으로 이동) -->
      <div class="button-wrapper">
        <button type="button" id="completeBtn" class="next-btn on">완료</button>
      </div>
    </main>

    <!-- 완료 버튼 클릭 시 메인 화면(main.html) 이동 스크립트 -->
    <script>
      const completeBtn = document.getElementById("completeBtn");

      completeBtn.addEventListener("click", function () {
        // 메인 화면 파일명에 맞게 경로를 수정해 주세요 (예: index.html 또는 main.html)
        window.location.href = "main.html";
      });
    </script>
  </body>
</html>
