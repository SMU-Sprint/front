<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>국제신체활동2 설문</title>
    <link rel="stylesheet" href="../css/survey3.css" />
  </head>

  <body>
    <main class="survey-container">
      <nav class="step-nav">
        <a href="survey1.html" class="step-item">운동동기</a>
        <a href="survey2.html" class="step-item">국제신체활동1</a>
        <a href="survey3.html" class="step-item active">국제신체활동2</a>
        <a href="survey4.html" class="step-item">노쇠설문</a>
        <a href="survey5.html" class="step-item">추천 운동</a>
      </nav>

      <form id="surveyForm" class="survey-box">
        <div class="question-group">
          <p class="question-title">
            지난 일주일 동안, 무거운 물건 나르기, 달리기 등과 같은 격렬한
            신체활동을 며칠간 하셨습니까?
          </p>
          <div class="options-row">
            <label class="checkbox-label"
              ><input type="radio" name="vigorous" value="2" /><span
                class="custom-box radio-box"
              ></span>
              주 1-2일</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="vigorous" value="4" /><span
                class="custom-box radio-box"
              ></span>
              주 3-4일</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="vigorous" value="5" /><span
                class="custom-box radio-box"
              ></span>
              주 5일 이상</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="vigorous" value="0" /><span
                class="custom-box radio-box"
              ></span>
              안한다.</label
            >
          </div>
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">
            지난 일주일 동안, 가벼운 물건 나르기, 자전거 타기 등과 같은 가벼운
            신체활동을 며칠간 하셨습니까?
          </p>
          <div class="options-row">
            <label class="checkbox-label"
              ><input type="radio" name="moderate" value="2" /><span
                class="custom-box radio-box"
              ></span>
              주 1-2일</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="moderate" value="4" /><span
                class="custom-box radio-box"
              ></span>
              주 3-4일</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="moderate" value="5" /><span
                class="custom-box radio-box"
              ></span>
              주 5일 이상</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="moderate" value="0" /><span
                class="custom-box radio-box"
              ></span>
              안한다.</label
            >
          </div>
        </div>

        <div class="divider"></div>

        <div class="question-group">
          <p class="question-title">
            지난 7일간, 한번에 적어도 10분 이상 걸은 날은 며칠입니까?
          </p>
          <div class="options-row">
            <label class="checkbox-label"
              ><input type="radio" name="walking" value="2" /><span
                class="custom-box radio-box"
              ></span>
              주 1-2일</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="walking" value="4" /><span
                class="custom-box radio-box"
              ></span>
              주 3-4일</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="walking" value="5" /><span
                class="custom-box radio-box"
              ></span>
              주 5일 이상</label
            >
            <label class="checkbox-label"
              ><input type="radio" name="walking" value="0" /><span
                class="custom-box radio-box"
              ></span>
              안한다.</label
            >
          </div>
        </div>
      </form>

      <div class="button-wrapper">
        <button type="button" id="nextBtn" class="next-btn off" disabled>
          다음
        </button>
      </div>
    </main>

    <script src="../js/survey3.js"></script>
  </body>
</html>
