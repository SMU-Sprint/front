<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장소</title>
    <link rel="stylesheet" href="../css/location.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <script src="../js/app.js" defer></script>
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/workout.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="../js/workout-config.js" defer></script>
    <script src="../js/workout-service.js" defer></script>
    <script src="../js/workout-ui.js" defer></script>
    <script src="../js/location-map.js" defer></script>
  </head>

  <body data-page="place" data-workout-page="locations">
    <div class="page-wrapper">
      <!-- 사이드바 영역: 배경 없이 개별 버튼 이미지 세 개를 수직 나열 -->
      <div id="sidebar-container"></div>

      <!-- 오른쪽 메인 장소/지도 영역 (location.png) -->
      <section
        class="main-section"
>
        <!-- 추후 지도 API가 얹어질 공간 -->
        <div class="map-and-locations">
          <div id="workout-map" class="map-container" aria-label="운동 장소 지도"></div>
          <div id="location-list" class="location-list" aria-label="운동 장소 목록"></div>
          <p class="demo-note" data-demo-note hidden>체험 모드 · 장소·종목은 예시이며, 기록은 이 브라우저에만 저장됩니다.</p>
          <p id="workout-message" class="workout-message" role="status"></p>
        </div>
      </section>
    </div>
  </body>
</html>
