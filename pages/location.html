<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장소</title>
    <link rel="stylesheet" href="../css/location.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <script src="../js/app.js" defer></script>
  </head>

  <body data-page="place">
    <div class="page-wrapper">
      <!-- 사이드바 영역: 배경 없이 개별 버튼 이미지 세 개를 수직 나열 -->
      <div id="sidebar-container"></div>

      <!-- 오른쪽 메인 장소/지도 영역 (location.png) -->
      <section
        class="main-section"
        style="background-image: url(&quot;../images/location.png&quot;)"
      >
        <!-- 추후 지도 API가 얹어질 공간 -->
        <div id="mapContainer" class="map-container">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d101235.39433917822!2d126.89136195729724!3d37.53488210359146!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca2012d5c39cf%3A0x7e11eca1405bf29b!2z7ISc7Jq47Yq567OE7Iuc!5e0!3m2!1sko!2skr!4v1700000000000!5m2!1sko!2skr"
            width="100%"
            height="100%"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          >
          </iframe>
        </div>
      </section>
    </div>
  </body>
</html>
