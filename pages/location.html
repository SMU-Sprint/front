<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장소</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="../css/location.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <script src="../js/app.js" defer></script>
    <script src="../js/facilities-data.js" defer></script>
    <script
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5dd186629d1ef37a8c1e69161acc639c&autoload=false&libraries=clusterer"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
      defer
    ></script>
    <script src="../js/location-map.js" defer></script>
  </head>

  <body data-page="place" data-workout-page="locations">
    <div class="page-wrapper">
      <!-- 사이드바 영역: 배경 없이 개별 버튼 이미지 세 개를 수직 나열 -->
      <div id="sidebar-container"></div>

      <!-- 오른쪽 메인 장소/지도 영역 (location.png) -->
      <section
        class="main-section"
        style="background-image: url(&quot;../images/location.png&quot;)"
      >
        <div id="mapContainer" class="map-container">
          <div id="kakaoMap" class="kakao-map" aria-label="체육시설 지도"></div>
          <div id="mapStatus" class="map-status">
            장소 데이터를 불러오는 중입니다.
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
