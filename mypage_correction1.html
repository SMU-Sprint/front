<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint | 정보 수정 인증</title>
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/mypage_correction1.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="mypage-correction1">
    <div id="sidebar-container"></div>
    <main class="app-shell correction-auth">
      <section class="auth-box">
        <h1>정보 수정하기</h1>
        <div class="auth-row">
        <input
            type="email"
            id="email"
            placeholder="이메일"
        />
        <button
            type="button"
            id="send-code-btn"
            class="auth-btn"
        >
            인증번호 받기
        </button>
        </div>

        <div class="auth-row">
        <input
            type="text"
            id="verification-code"
            placeholder="인증번호"
            disabled
        />
        <button
            type="button"
            id="verify-code-btn"
            class="auth-btn"
            disabled
        >
            인증번호 확인
        </button>
        </div>

        <button
        type="button"
        id="next-btn"
        class="next"
        disabled
        >
        다음
        </button>
      </section>
    </main>
  </body>
</html>
<script>
  const sendCodeBtn = document.getElementById("send-code-btn");
  const verifyCodeBtn = document.getElementById("verify-code-btn");
  const verificationCode = document.getElementById("verification-code");
  const nextBtn = document.getElementById("next-btn");

  sendCodeBtn.addEventListener("click", function () {
    verificationCode.disabled = false;
    verifyCodeBtn.disabled = false;

    verificationCode.focus();
  });

  verifyCodeBtn.addEventListener("click", function () {
    /*
      나중에는 여기서 서버에 인증번호가 맞는지 확인하고
      성공했을 때만 실행하면 됨.
    */

    nextBtn.disabled = false;
  });

  nextBtn.addEventListener("click", function () {
    if (!nextBtn.disabled) {
      location.href = "mypage_correction2.html";
    }
  });
</script>
