<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint | 정보 수정</title>
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/mypage_correction2.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="mypage-correction2">
    <div id="sidebar-container"></div>
    <main class="app-shell correction-form">
      <form>
        <label>
        <span>나이</span>
        <div class="value-with-unit">
            <input type="number" value="00" />
            <span>세</span>
        </div>
        </label>

        <label>
        <span>키</span>
        <div class="value-with-unit">
            <input type="number" value="000" />
            <span>cm</span>
        </div>
        </label>

        <label>
        <span>몸무게</span>
        <div class="value-with-unit">
            <input type="number" value="00" />
            <span>kg</span>
        </div>
        </label>

        <label>
        <span>운동지역</span>
        <input value="000" />
        </label>

        <label>
        <span>선호하는 운동 요일</span>
        <input value="00,00,00,00" />
        </label>

        <label>
        <span>선호하는 운동 시간대</span>
        <input value="00시,00시,00시" />
        </label>
        <button type="button" onclick="location.href = 'mypage.html'">
          수정완료
        </button>
      </form>
    </main>
  </body>
</html>
